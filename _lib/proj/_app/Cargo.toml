[package]
name = "swawkit-proj"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "swawkit-proj"
path = "src/main.rs"

[[bin]]
name = "swawkit-proj-host"
path = "src/host/main.rs"

[[bin]]
name = "swawkit-proj-toolchain"
path = "src/toolchain/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "~1.51.0", features = ["macros", "net", "rt", "sync"] }
tray-icon = "0.24.2"
webbrowser = { version = "1.2.1", features = ["hardened"] }
ureq = { version = "3.4.0", default-features = false, features = [
    "platform-verifier",
    "rustls",
    "win-system-proxy",
] }
url = "2.5.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winit = "0.30.13"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
